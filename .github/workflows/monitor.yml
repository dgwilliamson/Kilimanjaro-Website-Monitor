name: Kilimanjaro donation monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC); GitHub may delay runs at busy times
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # lets the job commit the saved state file

concurrency:
  group: kili-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4

      - name: Check page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: kili_state.json
        # "|| true" stops a one-off website hiccup marking the run as failed
        # and sending you a GitHub failure email every 15 minutes
        run: python kilimanjaro_monitor.py || true

      - name: Save state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kili_state.json
          git diff --cached --quiet || (git commit -m "Update donation state" && git push)
